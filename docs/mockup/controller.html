<title>Pocket Party Controller</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one-screen phone controller. Top = what the TV shows, middle = the screen for this moment, bottom = stick + buttons. Single committed look: painted night turf. */
:root{
  --turf:#123b2c; --turf-2:#1a4d39; --chalk:#f6f1de; --ink:#0d2219; --muted:#a8c4b4;
  --team:#d7263d; --team-2:#ffb612; --team-ink:#ffffff;
  --good:#5fd38a; --warn:#ffcf4a;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
.grains{ --team:#1f8a4c; --team-2:#f6f1de; --team-ink:#ffffff; }
html,body{height:100%}
body{background:var(--turf);color:var(--chalk);font-family:var(--body);font-weight:600;
  background-image:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.035) 46px 92px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
.app{max-width:760px;margin:0 auto;padding-block:12px 20px;display:flex;flex-direction:column;gap:12px;min-height:100%;box-sizing:border-box}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.02em;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--warn);outline-offset:2px}

/* steps */
.steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.steps button{flex:0 0 auto;border:2px solid var(--turf-2);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.steps button[aria-current="true"]{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}

/* TV strip */
.tv{display:flex;align-items:center;gap:10px;background:var(--ink);border-radius:12px;padding:8px 12px;font-size:13px}
.tv .tag{font-family:var(--display);font-size:12px;letter-spacing:.08em;color:var(--muted)}
.tv .msg{flex:1;min-width:0;font-weight:800}
.score{font-variant-numeric:tabular-nums;font-family:var(--display);white-space:nowrap}

.card{background:var(--turf-2);border-radius:16px;padding:14px}
.line{font-size:15px;font-weight:800;min-height:1.4em}
.sub{color:var(--muted);font-size:13px}

/* join */
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{border:3px solid transparent;border-radius:14px;padding:14px 10px;font-family:var(--display);font-size:22px;background:var(--ink)}
.team.arrows{color:#ffb612}.team.rr{color:#5fd38a}
.team[aria-pressed="true"]{border-color:var(--chalk)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--muted);background:transparent;border-radius:10px;padding:8px 12px;font-weight:800}
.chip[aria-pressed="true"]{background:var(--team);border-color:var(--team);color:var(--team-ink)}
.chip:disabled{opacity:.35;cursor:default}

/* huddle */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px}
.clock{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums;color:var(--warn)}
.plays{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.play{position:relative;text-align:left;border:3px solid transparent;border-radius:14px;background:var(--ink);padding:10px;display:flex;flex-direction:column;gap:6px}
.play[aria-pressed="true"]{border-color:var(--team-2)}
.play b{font-family:var(--display);font-weight:400;font-size:18px}
.play small{color:var(--muted);font-size:12px}
.play svg{width:100%;height:auto;display:block;border-radius:8px}
.thumbs{position:absolute;top:8px;right:8px;background:var(--team);color:var(--team-ink);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:800}
.big{border:0;border-radius:16px;padding:16px;font-family:var(--display);font-size:24px;background:var(--team);color:var(--team-ink);box-shadow:0 5px 0 rgba(0,0,0,.35)}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.big:disabled{opacity:.4}
.toggle{display:flex;gap:6px;font-size:13px;align-items:center;flex-wrap:wrap}

/* job */
.field{width:100%;height:auto;display:block}

/* live */
.roles{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.roles .chip{white-space:nowrap;flex:0 0 auto}
.pad{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px;align-items:end}
.stick{position:relative;aspect-ratio:1;max-width:200px;width:100%;border-radius:50%;background:radial-gradient(circle,var(--turf-2) 0 55%,var(--ink) 56%);touch-action:none;justify-self:start}
.knob{position:absolute;left:50%;top:50%;width:40%;aspect-ratio:1;margin:-20% 0 0 -20%;border-radius:50%;background:var(--chalk);box-shadow:0 4px 0 rgba(0,0,0,.35);pointer-events:none}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:18px;min-height:76px;padding:8px;font-family:var(--display);font-size:19px;line-height:1.05;background:var(--chalk);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.35);touch-action:none}
.btn.main{background:var(--team);color:var(--team-ink)}
.btn.alt{background:var(--team-2);color:var(--ink)}
.btn.on,.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.35);filter:brightness(1.12)}
.btn .k{display:block;font-family:var(--body);font-size:11px;font-weight:800;opacity:.7;margin-top:2px}
.shape{font-size:26px;display:block}
.stam{height:10px;border-radius:999px;background:var(--ink);overflow:hidden}
.stam i{display:block;height:100%;width:100%;background:var(--good);transition:width .1s linear}
.meter{position:relative;height:220px;border-radius:16px;background:linear-gradient(var(--ink),var(--turf-2));touch-action:none;overflow:hidden}
.meter .posts{position:absolute;left:50%;top:14px;width:80px;margin-left:-40px;height:50px;border:5px solid var(--warn);border-top:0;border-bottom:0}
.meter .ball{position:absolute;left:50%;bottom:16px;width:26px;height:16px;margin-left:-13px;border-radius:50%;background:#8b4a22}
.meter .hint{position:absolute;inset:auto 0 50px;text-align:center;color:var(--muted);font-size:13px}
.result{text-align:center}
.result h2{font-size:34px;color:var(--team-2)}
@media (max-width:420px){.btn{min-height:68px;font-size:17px}.pad{grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr)}}
@media (prefers-reduced-motion:reduce){.big:active,.btn:active,.btn.on{transform:none}}
</style>

<div class="app" id="app">
  <nav class="steps" id="steps" aria-label="Mockup steps"></nav>
  <div class="tv" aria-live="polite"><span class="tag">ON THE TV</span><span class="msg" id="tv">Scan the code to join: KEEL</span><span class="score" id="score">ARR 0 · GRN 0</span></div>
  <main id="screen"></main>
</div>

<script>
const $ = s => document.querySelector(s);
const S = { step:'join', team:'arrows', off:'QB', def:'LB', name:'Kenny', caller:true, side:'offense',
  call:null, locked:false, oppLocked:false, clock:15, role:null, score:[0,0], stamina:1 };
const STEPS = [['join','1 Join'],['huddle','2 Huddle'],['job','3 Your job'],['live','4 Live play'],['kick','5 Kick'],['result','6 Whistle']];
const OFF_POS = ['QB','RB','WR','TE','OL'], DEF_POS = ['DL','LB','CB','S'];
const TEAM = { arrows:{name:'ARROWS',short:'ARR'}, rr:{name:'GRAINS',short:'GRN'} };
const other = () => S.team==='arrows' ? 'rr' : 'arrows';

/* Plays as data: same shape the Unity game will read from plays/*.json. Field: offense attacks right, line of scrimmage x=120. */
const SPOT = { QB:[104,80], RB:[86,80], WR:[118,22], WR2:[118,138], TE:[118,106], OL:[116,80],
  DL:[126,80], LB:[150,80], CB:[134,22], S:[196,54] };
const OPLAYS = [
  {id:'dive',name:'HB Dive',d:'Handoff up the middle',
   job:{QB:{path:[[104,80],[96,86]],t:'Hand off to the RB, then carry out the fake'},RB:{path:[[86,80],[130,80],[200,80]],t:'Take the handoff, hit the hole over center'},WR:{path:[[118,22],[200,22]],t:'Run off your corner: go route'},TE:{block:[128,104],t:'Block the end on your side'},OL:{block:[128,80],t:'Drive the man in front of you'}}},
  {id:'toss',name:'Toss Sweep',d:'Pitch to the RB wide',
   job:{QB:{path:[[104,80],[100,90]],t:'Pitch to the RB, then lead block'},RB:{path:[[86,80],[106,124],[150,142],[230,142]],t:'Catch the pitch, race for the edge'},WR:{block:[134,30],t:'Block your cornerback'},TE:{block:[130,118],t:'Seal the edge: block the linebacker'},OL:{path:[[116,80],[124,110],[140,130]],t:'Pull right and lead the sweep'}}},
  {id:'slants',name:'Slants',d:'Quick throw inside',
   job:{QB:{path:[[104,80],[94,80]],t:'Three-step drop. Throw to △ as he cuts'},RB:{block:[110,96],t:'Stay in and block a blitzer'},WR:{path:[[118,22],[136,22],[176,56]],t:'Slant: 3 steps, cut inside hard'},TE:{path:[[118,106],[150,106],[178,90]],t:'Short out route under the slant'},OL:{block:[124,80],t:'Pass block: stay between him and the QB'}}},
  {id:'verts',name:'Four Verticals',d:'Everyone goes deep',
   job:{QB:{path:[[104,80],[86,80]],t:'Five-step drop. Find the open deep man'},RB:{path:[[86,80],[112,132],[150,150]],t:'Check the blitz, then leak to the flat'},WR:{path:[[118,22],[270,22]],t:'Go route: full sprint up the sideline'},TE:{path:[[118,106],[262,100]],t:'Seam route straight up the field'},OL:{block:[124,80],t:'Pass block: hold it 4 seconds'}}},
  {id:'boot',name:'PA Boot',d:'Fake, roll out, drag',
   job:{QB:{path:[[104,80],[92,90],[100,122],[118,138]],t:'Fake the handoff, roll right, throw on the run'},RB:{path:[[86,80],[122,74]],t:'Sell the fake: run into the line'},WR:{path:[[118,22],[200,22],[210,34]],t:'Comeback: deep, then turn back'},TE:{path:[[118,106],[146,104],[170,46]],t:'Drag across the field at 5 yards'},OL:{block:[126,74],t:'Fake a run block, then hold'}}},
  {id:'screen',name:'HB Screen',d:'Let them in, dump it off',
   job:{QB:{path:[[104,80],[84,80]],t:'Drop deep, float it to the RB over the rush'},RB:{path:[[86,80],[100,120],[112,134]],t:'Slip out behind the line, catch, follow blockers'},WR:{block:[134,30],t:'Block your cornerback'},TE:{block:[130,118],t:'Chip the end, then release'},OL:{path:[[116,80],[110,92],[130,128]],t:'Let him by, then run out and block for the RB'}}},
  {id:'sneak',name:'QB Sneak',d:'For 4th and 1',
   job:{QB:{path:[[104,80],[136,80]],t:'Snap and push straight ahead behind center'},RB:{path:[[86,80],[108,80]],t:'Push the QB from behind'},WR:{block:[132,30],t:'Block your man'},TE:{block:[128,104],t:'Block down on the end'},OL:{block:[126,80],t:'Fire low and drive forward'}}},
  {id:'punt',name:'Punt',d:'4th down only',job:{}},
];
const DPLAYS = [
  {id:'c2',name:'Cover 2',d:'Two deep halves',job:{DL:{rush:1,t:'Rush the QB'},LB:{zone:[160,80,22,26],t:'Drop to the middle hook zone'},CB:{zone:[148,22,18,16],t:'Sit in the flat, jam the WR'},S:{zone:[220,50,34,30],t:'Deep half: nothing gets behind you'}}},
  {id:'c3',name:'Cover 3',d:'Three deep thirds',job:{DL:{rush:1,t:'Rush the QB'},LB:{zone:[156,80,22,22],t:'Hook zone in the middle'},CB:{zone:[230,24,34,18],t:'Deep third on your side'},S:{zone:[150,60,20,20],t:'Drop down to the curl zone'}}},
  {id:'mblitz',name:'Man Blitz',d:'Send the house',job:{DL:{rush:1,t:'Rush the QB'},LB:{rush:1,t:'Blitz the A-gap: get the QB'},CB:{man:'WR',t:'Man on the △ receiver, stay tight'},S:{man:'TE',t:'Man on the tight end'}}},
  {id:'zblitz',name:'Zone Blitz',d:'Surprise rusher',job:{DL:{zone:[150,96,18,16],t:'Drop into coverage (surprise!)'},LB:{rush:1,t:'Blitz off the edge'},CB:{zone:[226,24,34,18],t:'Deep third on your side'},S:{zone:[220,90,34,30],t:'Deep middle'}}},
  {id:'goal',name:'Goal Line',d:'Stop the run',job:{DL:{rush:1,t:'Fire low, plug your gap'},LB:{path:[[150,80],[128,82]],t:'Fill the hole, hit the RB'},CB:{man:'WR',t:'Press the WR on the line'},S:{path:[[196,54],[150,70]],t:'Come down and stop the run'}}},
  {id:'prevent',name:'Prevent',d:'Everyone deep',job:{DL:{rush:1,t:'Rush, but stay in your lane'},LB:{zone:[190,80,30,30],t:'Drop deep to the middle'},CB:{zone:[250,24,30,18],t:'Deep outside: give up the short stuff'},S:{zone:[268,80,26,40],t:'Deepest man on the field'}}},
];
const SUGG = { dive:1, slants:2, verts:3, boot:1, c3:2, mblitz:3 }; // example teammate thumbs-ups

function field(play, pos, big){
  const j = play && play.job[pos];
  const w = big ? 300 : 300, h = 160;
  let marks = '';
  const off = OFF_POS.includes(pos);
  const others = off ? ['QB','RB','WR','WR2','TE'] : ['DL','LB','CB','S'];
  for (const p of others) { const [x,y] = SPOT[p]; if (p!==pos) marks += `<circle cx="${x}" cy="${y}" r="4" fill="#a8c4b4" opacity=".6"/>`; }
  if (off) for (const y of [64,72,80,88,96]) if (pos!=='OL'||y!==80) marks += `<rect x="113" y="${y-3}" width="6" height="6" fill="#a8c4b4" opacity=".6"/>`;
  const me = SPOT[pos];
  let job = '';
  if (j && j.path) job += `<polyline points="${j.path.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--team-2)" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#ah${big?1:0})"/>`;
  if (j && j.block) job += `<line x1="${me[0]}" y1="${me[1]}" x2="${j.block[0]}" y2="${j.block[1]}" stroke="var(--team-2)" stroke-width="3.5"/><line x1="${j.block[0]}" y1="${j.block[1]-7}" x2="${j.block[0]}" y2="${j.block[1]+7}" stroke="var(--team-2)" stroke-width="4"/>`;
  if (j && j.zone) { const [x,y,rx,ry]=j.zone; job += `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="var(--team-2)" fill-opacity=".25" stroke="var(--team-2)" stroke-width="2" stroke-dasharray="5 4"/><line x1="${me[0]}" y1="${me[1]}" x2="${x}" y2="${y}" stroke="var(--team-2)" stroke-width="2.5" marker-end="url(#ah${big?1:0})"/>`; }
  if (j && j.rush) job += `<polyline points="${me[0]},${me[1]} 112,${me[1]} 100,80" fill="none" stroke="var(--team-2)" stroke-width="3.5" marker-end="url(#ah${big?1:0})"/>`;
  if (j && j.man) { const t = j.man==='WR' ? [118,22] : [118,106]; job += `<line x1="${me[0]}" y1="${me[1]}" x2="${t[0]+6}" y2="${t[1]}" stroke="var(--team-2)" stroke-width="3" stroke-dasharray="6 4"/><text x="${t[0]-6}" y="${t[1]-8}" fill="var(--team-2)" font-size="14" text-anchor="middle">${j.man==='WR'?'△':'◇'}</text>`; }
  if (pos==='QB') marks += [['△',118,22],['○',118,138],['□',118,106],['◇',86,80]].map(([c,x,y])=>`<text x="${x-12}" y="${y+5}" font-size="13" text-anchor="middle" fill="#f6f1de">${c}</text>`).join('');
  if (!off) for (const p of ['QB','RB','WR','WR2','TE']) { const [x,y]=SPOT[p]; marks += `<text x="${x}" y="${y+4}" font-size="10" text-anchor="middle" fill="#f6f1de" opacity=".55">o</text>`; }
  return `<svg class="field" viewBox="0 0 ${w} ${h}" role="img" aria-label="${pos} assignment">
    <defs><marker id="ah${big?1:0}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--team-2)"/></marker></defs>
    <rect width="300" height="160" fill="#1f6b45"/>
    ${[40,80,160,200,240,280].map(x=>`<line x1="${x}" y1="0" x2="${x}" y2="160" stroke="#fff" stroke-opacity=".18"/>`).join('')}
    <line x1="120" y1="0" x2="120" y2="160" stroke="#5fb4ff" stroke-width="2"/>
    <line x1="160" y1="0" x2="160" y2="160" stroke="#ffcf4a" stroke-width="2" stroke-opacity=".8"/>
    ${marks}${job}
    <circle cx="${me[0]}" cy="${me[1]}" r="7" fill="var(--team)" stroke="#fff" stroke-width="2.5"/>
  </svg>`;
}

const plays = () => S.side==='offense' ? OPLAYS : DPLAYS;
const myPos = () => S.side==='offense' ? S.off : S.def;
const playById = id => [...OPLAYS,...DPLAYS].find(p=>p.id===id);
function tv(t){ $('#tv').textContent = t; }
function score(){ $('#score').textContent = `ARR ${S.score[0]} · GRN ${S.score[1]}`; }

function nav(){
  $('#steps').innerHTML = STEPS.map(([k,l])=>`<button data-go="${k}" aria-current="${S.step===k}">${l}</button>`).join('');
}
let timer = null;
function go(step){ S.step = step; clearInterval(timer); timer=null; nav(); render(); }

function render(){
  document.body.classList.toggle('grains', S.team==='rr');
  const el = $('#screen');
  const T = TEAM[S.team];
  if (S.step==='join'){
    tv('Scan the code to join: KEEL · 6 people in');
    el.innerHTML = `<div class="card" style="display:grid;gap:14px">
      <h2>Pick your side, ${S.name}</h2>
      <div class="pick">
        <button class="team arrows" data-team="arrows" aria-pressed="${S.team==='arrows'}">ARROWS<div class="sub">3 people · 8 bots</div></button>
        <button class="team rr" data-team="rr" aria-pressed="${S.team==='rr'}">GRAINS<div class="sub">3 people · 8 bots</div></button>
      </div>
      <div><h3>On offense you play</h3><div class="sub">You play both ways while there are fewer than 22 people. Taken spots are greyed (example).</div></div>
      <div class="chips">${OFF_POS.map(p=>`<button class="chip" data-off="${p}" aria-pressed="${S.off===p}" ${p==='TE'?'disabled':''}>${p}</button>`).join('')}</div>
      <h3>On defense you play</h3>
      <div class="chips">${DEF_POS.map(p=>`<button class="chip" data-def="${p}" aria-pressed="${S.def===p}" ${p==='CB'?'disabled':''}>${p}</button>`).join('')}</div>
      <button class="big" data-go="huddle">Run onto the field</button>
    </div>`;
  }
  if (S.step==='huddle'){
    if (S.clock<=0) S.clock = 15;
    const list = plays();
    tv(`HUDDLE · ${TEAM.arrows.name} ${S.team==='arrows'&&S.locked?'CALLED ✓':'…'}   ${TEAM.rr.name} ${(S.team==='rr'&&S.locked)||S.oppLocked?'CALLED ✓':'…'}`);
    el.innerHTML = `<div style="display:grid;gap:12px">
      <div class="card hud"><div><h2>${T.name} ${S.side==='offense'?'OFFENSE':'DEFENSE'}</h2><div class="sub">2nd & 7 on the 38 · only your team sees this</div></div><div class="clock" id="clock">0:${String(S.clock).padStart(2,'0')}</div></div>
      <div class="toggle"><span class="sub">Mockup:</span>
        <button class="chip" data-side="offense" aria-pressed="${S.side==='offense'}">Offense</button>
        <button class="chip" data-side="defense" aria-pressed="${S.side==='defense'}">Defense</button>
        <button class="chip" data-caller="1" aria-pressed="${S.caller}">I'm the play caller</button>
        <button class="chip" data-caller="0" aria-pressed="${!S.caller}">I'm a teammate</button></div>
      <div class="plays">${list.map(p=>`<button class="play" data-play="${p.id}" aria-pressed="${S.call===p.id}">
        ${SUGG[p.id]?`<span class="thumbs">👍 ${SUGG[p.id]+(S.call===p.id&&!S.caller?1:0)}</span>`:''}
        <b>${p.name}</b><small>${p.d}</small>${p.id==='punt'?'':field(p, myPos())}</button>`).join('')}</div>
      <div class="line" id="hline">${S.locked?'Locked in. Look at your job.':S.caller?'Tap a play, then LOCK IN. Thumbs are your teammates\' suggestions.':'Tap a play to suggest it. Your caller decides.'}</div>
      <button class="big" id="lock" ${(!S.call||S.locked)?'disabled':''}>${S.caller?'LOCK IN':'SUGGEST'}</button>
    </div>`;
    if (!S.locked) timer = setInterval(()=>{ S.clock--; const c=$('#clock'); if(c) c.textContent = `0:${String(Math.max(0,S.clock)).padStart(2,'0')}`;
      if (S.clock===9 && !S.oppLocked){ S.oppLocked=true; tv(`HUDDLE · ${TEAM[other()].name} CALLED ✓ · ${T.name} …`); }
      if (S.clock<=0){ clearInterval(timer); if(!S.call) S.call = S.side==='offense'?'slants':'c3'; S.locked=true; $('#hline').textContent='Time! The bot coach picked '+playById(S.call).name+'.'; setTimeout(()=>go('job'),1300);} },1000);
  }
  if (S.step==='job'){
    const p = playById(S.call || (S.side==='offense'?'slants':'c3'));
    const pos = myPos(); const j = p.job[pos];
    tv(`${TEAM.arrows.name} CALLED ✓   ${TEAM.rr.name} CALLED ✓   · lining up`);
    el.innerHTML = `<div style="display:grid;gap:12px">
      <div class="card" style="display:grid;gap:10px">
        <div class="hud"><div><div class="sub">${p.name} · you are ${pos}</div><h2>${j?j.t:'Kick team: the play caller kicks'}</h2></div></div>
        ${p.id==='punt'?'':field(p,pos,true)}
        <div class="sub">Blue line = line of scrimmage, yellow = first-down marker. Your dot is the big one. Bots got the same plan.</div>
      </div>
      <button class="big" data-go="live">${pos==='QB'?'Go to the line':'Line up'}</button>
    </div>`;
  }
  if (S.step==='live') renderLive(el);
  if (S.step==='kick') renderKick(el);
  if (S.step==='result'){
    tv('FIRST DOWN! · replay of the catch');
    el.innerHTML = `<div class="card result" style="display:grid;gap:10px">
      <div class="sub">Whistle</div><h2>+14 YARDS · FIRST DOWN</h2>
      <div class="line">Slant to WR #11, tackled by #54</div>
      <div class="sub">The TV shows a 2-second slow-mo replay, then everyone goes back to the huddle.</div>
      <button class="big" data-go="huddle" id="again">Back to the huddle</button></div>`;
  }
}

/* live layouts: buttons per role, same rules as the plan's controls table */
const ROLES = {
  qbpre:{name:'QB before snap',line:'Tap HIKE when everyone is set',btns:[['HIKE','main','Starts the play'],['FIND ME','','Flash your ring on the TV']]},
  qb:{name:'QB pocket',line:'Tap = bullet pass · hold = lob',recv:true,btns:[]},
  carrier:{name:'Ball carrier',line:'Ball in hands! Run for it',stam:true,btns:[['SPRINT','main','Hold',1],['JUKE','alt','Stick picks the side'],['SPIN',''],['STIFF ARM','']]},
  route:{name:'Receiver',line:'Run your route: slant at 3 steps',stam:true,btns:[['SPRINT','main','Hold',1],['CALL FOR IT','alt','Your △ pulses on the TV'],['CATCH','','Jump for the ball']]},
  block:{name:'Blocker',line:'Hold BLOCK next to a defender',btns:[['BLOCK','main','Hold to lock on',1],['SPRINT','','Hold',1]]},
  rush:{name:'D-line',line:'Beat your blocker, get the QB',btns:[['SWIM','alt','Rush move'],['BULL RUSH',''],['TACKLE','main'],['SWAT','','Bat the pass']]},
  lb:{name:'Linebacker',line:'Read run or pass, then hit',stam:true,btns:[['SPRINT','','Hold',1],['TACKLE','main'],['DIVE TACKLE','alt','Big reach, slow to get up'],['SWAT','']]},
  db:{name:'Defensive back',line:'Stay with △. Jump for the pick',stam:true,btns:[['SPRINT','','Hold',1],['TACKLE','main'],['JUMP','alt','Pick or swat'],['DIVE TACKLE','']]},
};
const defaultRole = () => S.side==='offense' ? ({QB:'qbpre',RB:'carrier',WR:'route',TE:'route',OL:'block'})[S.off] : ({DL:'rush',LB:'lb',CB:'db',S:'db'})[S.def];
const RECV = [['△','WR #11'],['○','WR #17'],['□','TE #87'],['◇','RB #25']];
let stick = {x:0,y:0};
function renderLive(el){
  if (!S.role) S.role = defaultRole();
  const r = ROLES[S.role];
  tv(S.role==='qbpre'?'Set… waiting for the QB to hike':'LIVE PLAY');
  const btns = r.recv
    ? RECV.map(([s,n])=>`<button class="btn ${s==='△'?'main':''}" data-throw="${s}" data-who="${n}"><span class="shape">${s}</span>${n}</button>`).join('') + `<button class="btn alt" data-act="SCRAMBLE" style="grid-column:span 2;min-height:56px">SCRAMBLE</button>`
    : r.btns.map(([l,c,k,h])=>`<button class="btn ${c}" data-act="${l}" ${h?'data-hold="1"':''}>${l}${k?`<span class="k">${k}</span>`:''}</button>`).join('');
  el.innerHTML = `<div style="display:grid;gap:12px">
    <div class="roles">${Object.entries(ROLES).map(([k,v])=>`<button class="chip" data-role="${k}" aria-pressed="${S.role===k}">${v.name}</button>`).join('')}</div>
    <div class="card" style="display:grid;gap:8px"><div class="line" id="act">${r.line}</div>${r.stam?`<div class="stam" aria-label="Stamina"><i id="stam"></i></div>`:''}<div class="sub" id="stickread">Stick: center</div></div>
    <div class="pad"><div class="stick" id="stick" aria-label="Movement stick"><div class="knob" id="knob"></div></div><div class="btns">${btns}</div></div>
    ${S.role==='qbpre'?'':`<button class="chip" data-go="result" style="justify-self:end">Blow the whistle</button>`}
  </div>`;
  bindStick(); bindButtons(); drawStam();
}
function say(t){ const a=$('#act'); if(a) a.textContent=t; }
function drawStam(){ const s=$('#stam'); if(s){ s.style.width=Math.round(S.stamina*100)+'%'; s.style.background = S.stamina<.25?'var(--warn)':'var(--good)'; } }
function bindStick(){
  const st=$('#stick'), kn=$('#knob'); let id=null;
  const move = e=>{ const b=st.getBoundingClientRect(), r=b.width/2; let x=(e.clientX-b.left-r)/r, y=(e.clientY-b.top-r)/r; const m=Math.hypot(x,y); if(m>1){x/=m;y/=m;}
    stick={x,y}; kn.style.transform=`translate(${x*r*0.6}px,${y*r*0.6}px)`;
    const dir = Math.hypot(x,y)<.25?'center':[y<-.4?'up-field':y>.4?'down':'' , x>.4?'right':x<-.4?'left':''].filter(Boolean).join(' + ');
    $('#stickread').textContent='Stick: '+dir; };
  st.addEventListener('pointerdown',e=>{id=e.pointerId;st.setPointerCapture(id);move(e);});
  st.addEventListener('pointermove',e=>{ if(e.pointerId===id) move(e); });
  const end=e=>{ if(e.pointerId!==id) return; id=null; stick={x:0,y:0}; kn.style.transform=''; $('#stickread').textContent='Stick: center'; };
  st.addEventListener('pointerup',end); st.addEventListener('pointercancel',end);
}
let drain=null;
function bindButtons(){
  document.querySelectorAll('.btn').forEach(b=>{
    let t0=0;
    b.addEventListener('pointerdown',e=>{ e.preventDefault(); t0=performance.now(); b.classList.add('on');
      const a=b.dataset.act;
      if (b.dataset.hold){ say(a==='SPRINT'?'Sprinting… (stamina draining)':a==='BLOCK'?'Locked on! Driving him back':'Holding '+a);
        if(a==='SPRINT'){ clearInterval(drain); drain=setInterval(()=>{ S.stamina=Math.max(0,S.stamina-.04); drawStam(); if(!S.stamina) say('Out of gas! Let go to recover'); },100);} }
    });
    const up=()=>{ if(!b.classList.contains('on')) return; b.classList.remove('on'); const held=performance.now()-t0, a=b.dataset.act;
      if (b.dataset.throw){ say(`${held>350?'Soft lob':'Bullet pass'} to ${b.dataset.throw} ${b.dataset.who}!`); tv(`Pass to ${b.dataset.who}…`); setTimeout(()=>{ S.role='carrier'; render(); say('Caught! You\'re the ball carrier now: the buttons changed.'); },1100); return; }
      if (a==='SPRINT'){ clearInterval(drain); drain=setInterval(()=>{ S.stamina=Math.min(1,S.stamina+.03); drawStam(); if(S.stamina>=1) clearInterval(drain); },100); say('Jogging'); return; }
      if (a==='BLOCK'){ say('Released the block'); return; }
      if (a==='HIKE'){ S.role='qb'; render(); tv('HIKE! Live play'); return; }
      if (a==='JUKE'){ const side = stick.x<-.3?'LEFT':stick.x>.3?'RIGHT':(Math.random()<.5?'LEFT':'RIGHT'); say(`JUKE ${side}! The tackler whiffs`); tv(`JUKE ${side}!`); return; }
      if (a==='SCRAMBLE'){ S.role='carrier'; render(); say('Scramble! You\'re a runner now.'); return; }
      if (a==='CALL FOR IT'){ say('Your △ is pulsing on the TV and on the QB\'s phone'); tv('△ WR #11 is calling for it!'); return; }
      if (a==='FIND ME'){ say('Your ring flashes and a beam goes up on the TV'); tv(`FIND ME: ${S.name}`); return; }
      const msgs={SPIN:'SPIN MOVE!','STIFF ARM':'STIFF ARM! He bounces off',CATCH:'Jumping for the ball',SWIM:'Swim move: past the guard!','BULL RUSH':'Bull rush: pushing him back',TACKLE:'TACKLE! Big hit','DIVE TACKLE':'Diving tackle!',SWAT:'Hand up: swat!',JUMP:'Jump! Going for the pick'};
      say(msgs[a]||a); tv(msgs[a]||a);
    };
    b.addEventListener('pointerup',up); b.addEventListener('pointerleave',up); b.addEventListener('pointercancel',up);
  });
}
function renderKick(el){
  tv('FIELD GOAL TRY · 38 yards');
  el.innerHTML = `<div style="display:grid;gap:12px">
    <div class="card"><h2>You're the kicker</h2><div class="sub">Drag up from the ball: longer = more power, left/right = aim. Let go to kick.</div></div>
    <div class="meter" id="meter"><div class="posts"></div><div class="hint" id="khint">Drag up from the ball</div><div class="ball" id="kball"></div>
      <svg id="karrow" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></svg></div>
    <div class="line" id="kres"></div>
    <button class="chip" data-go="result" style="justify-self:end">Skip to the whistle</button></div>`;
  const m=$('#meter'); let p0=null;
  m.addEventListener('pointerdown',e=>{ const b=m.getBoundingClientRect(); p0={x:b.width/2,y:b.height-24,b}; m.setPointerCapture(e.pointerId); });
  m.addEventListener('pointermove',e=>{ if(!p0) return; const x=e.clientX-p0.b.left, y=e.clientY-p0.b.top; $('#karrow').innerHTML=`<line x1="${p0.x}" y1="${p0.y}" x2="${x}" y2="${y}" stroke="#ffcf4a" stroke-width="6" stroke-linecap="round"/>`;
    const pw=Math.min(1,Math.max(0,(p0.y-y)/(p0.b.height-60))); $('#khint').textContent=`Power ${Math.round(pw*100)}%`; });
  m.addEventListener('pointerup',e=>{ if(!p0) return; const x=e.clientX-p0.b.left, y=e.clientY-p0.b.top;
    const pw=Math.min(1,Math.max(0,(p0.y-y)/(p0.b.height-60))), aim=(x-p0.x)/(p0.b.width/2);
    const good = pw>.62 && Math.abs(aim)<.22;
    const res = good?'IT\'S GOOD! +3':pw<=.62?'Short! No good':(aim<0?'Wide left! No good':'Wide right! No good');
    $('#kres').textContent=`${Math.round(pw*100)}% power, aim ${aim<-.05?'left':aim>.05?'right':'straight'} · ${res}`; tv(res);
    if(good){ const i=S.team==='arrows'?0:1; S.score[i]+=3; score(); }
    p0=null; setTimeout(()=>{ const a=$('#karrow'); if(a) a.innerHTML=''; },700); });
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if (t.dataset.go){ if(t.dataset.go==='huddle'&&t.id==='again'){S.locked=false;S.oppLocked=false;S.call=null;S.clock=15;S.role=null;} if(t.dataset.go==='live') S.role=null; go(t.dataset.go); return; }
  if (t.dataset.team){ S.team=t.dataset.team; render(); return; }
  if (t.dataset.off){ S.off=t.dataset.off; render(); return; }
  if (t.dataset.def){ S.def=t.dataset.def; render(); return; }
  if (t.dataset.side){ S.side=t.dataset.side; S.call=null; S.locked=false; S.role=null; S.clock=15; go('huddle'); return; }
  if (t.dataset.caller){ S.caller=t.dataset.caller==='1'; S.locked=false; go('huddle'); return; }
  if (t.dataset.play && !S.locked){ S.call=t.dataset.play; document.querySelectorAll('.play').forEach(b=>b.setAttribute('aria-pressed', b.dataset.play===S.call)); $('#lock').disabled=false; return; }
  if (t.id==='lock'){ S.locked=true; clearInterval(timer); $('#lock').disabled=true;
    $('#hline').textContent = S.caller ? `Locked: ${playById(S.call).name}. The TV only shows a check mark.` : `Suggested ${playById(S.call).name}. Your caller sees your thumbs-up.`;
    tv(`HUDDLE · ${TEAM[S.team].name} CALLED ✓ · ${TEAM[other()].name} ${S.oppLocked?'CALLED ✓':'…'}`);
    setTimeout(()=>go('job'),1400); return; }
  if (t.dataset.role){ S.role=t.dataset.role; render(); return; }
});
nav(); render(); score();
</script>
