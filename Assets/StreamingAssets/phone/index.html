<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#123b2c">
<title>Pocket Party Football</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/huddle.css">
<link rel="stylesheet" href="/layouts.css">
</head>
<body>
<div class="app">
  <div class="tvstrip hidden" id="tvStrip" aria-live="polite"><span class="tag">ON THE TV</span><span class="msg" id="tvMsg"></span><span class="score" id="tvScore"></span></div>
  <section id="joinView" class="view">
    <h1>Pocket Party Football</h1>
    <label class="field">Your name<input id="name" maxlength="12" autocomplete="nickname" autocapitalize="characters"></label>
    <label class="field">Room code (on the TV)<input id="code" maxlength="4" autocomplete="off" autocapitalize="characters"></label>
    <button id="joinBtn" class="big" aria-label="Join the game">JOIN</button>
    <p id="joinMsg" class="sub" aria-live="polite"></p>
  </section>

  <section id="pickView" class="view hidden">
    <h2 id="pickTitle">Pick your side</h2>
    <div class="pick" id="teams"></div>
    <p class="sub">Every spot nobody takes is played by a bot.</p>
  </section>

  <section id="huddleView" class="view hidden">
    <div class="card hud"><div><h2 id="hTitle">HUDDLE</h2><p class="sub" id="hSub">Only your team sees this</p></div><div class="clock" id="hClock">0:15</div></div>
    <div class="plays" id="hPlays"></div>
    <p class="line" id="hLine" aria-live="polite"></p>
    <button class="big" id="hGo" disabled aria-label="Lock in the chosen play">LOCK IN</button>
  </section>

  <section id="playView" class="view hidden">
    <header class="me" id="me"><span id="meName">YOU</span><span id="meNum" class="num">#1</span></header>
    <div class="card job hidden" id="job"><p class="sub" id="jobPlay"></p><h3 id="jobText"></h3><div id="jobField"></div></div>
    <p class="line" id="line" aria-live="polite">Run with the stick. Hold SPRINT to go faster.</p>
    <div class="stam" aria-label="Stamina"><i id="stam"></i></div>
    <div class="pad">
      <div class="stick" id="stick" aria-label="Movement stick: drag to walk"><div class="knob" id="knob"></div></div>
      <div class="btns hidden" id="btnBox"></div>
      <div class="btns" id="walkBtns">
        <button class="btn main" id="sprintBtn" data-b="sprint" aria-label="Sprint: hold to run faster (uses stamina)">SPRINT<span class="k">Hold. Uses stamina</span></button>
        <button class="btn" id="findBtn" data-b="find" aria-label="Find me: flash my name on the TV">FIND ME<span class="k">Your name gets big on the TV</span></button>
        <button class="btn small" id="teamBtn" aria-label="Change team">Change team</button>
      </div>
    </div>
  </section>
</div>
<div id="reconnect" class="overlay hidden" role="status">Reconnecting...</div>
<script src="/layouts.js"></script>
<script src="/app.js"></script>
<script src="/huddle.js"></script>
<script src="/receiving.js"></script>
</body>
</html>
